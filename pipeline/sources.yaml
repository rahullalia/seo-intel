# Source registry. Researchers read their tier only. `feed` is read first when present; `verify` marks
# URLs the bootstrap must confirm before trusting. trust: primary | study | test | opinion.
# check: every (every run) | monthly | quarterly (stable reference pages, re-read for changes only).

google:
  # This tier is the primary-source tier. Government regulators (FTC review rule, 16 CFR 465) file here too, grade A.
  - name: FTC rule on fake reviews and testimonials (16 CFR Part 465)
    url: https://www.ftc.gov/legal-library/browse/rules/rule-use-consumer-reviews-testimonials
    trust: primary
    check: quarterly
    categories: [local-gbp]
  - name: Google Search Central Blog
    url: https://developers.google.com/search/blog
    feed: https://feeds.feedburner.com/blogspot/amDG
    verified: 2026-09-06 (rss.xml on developers.google.com returns 404; the FeedBurner feed is the live one)
    trust: primary
    check: every
    categories: [technical, content, ai-search, signals]
  - name: Google Search Status Dashboard (ranking updates)
    url: https://status.search.google.com/summary
    verified: 2026-09-06 (incidents.rss returns 404; read the summary page and follow incident links)
    trust: primary
    check: every
    categories: [signals, content]
  - name: Google core updates list
    url: https://developers.google.com/search/updates/core-updates
    trust: primary
    check: every
    categories: [signals, content]
  - name: Ranking systems guide
    url: https://developers.google.com/search/docs/appearance/ranking-systems-guide
    trust: primary
    check: monthly
    categories: [signals, content, backlinks]
  - name: Spam policies
    url: https://developers.google.com/search/docs/essentials/spam-policies
    trust: primary
    check: monthly
    categories: [backlinks, content, technical, programmatic]
  - name: Search Essentials and SEO starter guide
    url: https://developers.google.com/search/docs/essentials
    trust: primary
    check: quarterly
    categories: [technical, content]
  - name: AI features and your website
    url: https://developers.google.com/search/docs/appearance/ai-features
    trust: primary
    check: every
    categories: [ai-search]
  - name: Page experience and Core Web Vitals docs
    url: https://developers.google.com/search/docs/appearance/page-experience
    trust: primary
    check: quarterly
    categories: [technical, website-design]
  - name: Structured data gallery and changes
    url: https://developers.google.com/search/docs/appearance/structured-data/search-gallery
    trust: primary
    check: monthly
    categories: [technical]
  - name: Google Business Profile guidelines
    url: https://support.google.com/business/answer/3038177
    trust: primary
    check: every
    categories: [local-gbp]
  - name: Google Business Profile Help (policy and feature changes)
    url: https://support.google.com/business
    verified: 2026-09-06 (the /announcements page returns 404; watch the Help home, the review policy page answer/7400114, and blog.google Maps posts)
    trust: primary
    check: every
    categories: [local-gbp, citations]
  - name: Local ranking help page (relevance, distance, prominence)
    url: https://support.google.com/business/answer/7091
    trust: primary
    check: quarterly
    categories: [local-gbp]
  - name: Google Search Liaison (X)
    url: https://x.com/searchliaison
    trust: primary
    check: every
    categories: [signals, content, ai-search]
    note: statements only, no threads without a Google source behind them
  - name: Search Off the Record podcast and Search Central YouTube
    url: https://www.youtube.com/@GoogleSearchCentral
    trust: primary
    check: monthly
    categories: [technical, content]

